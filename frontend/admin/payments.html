<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Revenue &amp; Settlements - ParkSmart Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

  <div class="app-layout admin-layout">
    <div id="app-sidebar-container"></div>

    <div class="app-main">
      <div id="app-topbar-container"></div>

      <div class="content-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">Revenue &amp; Payment Settlement Audit</h1>
            <p class="page-subtitle">Master ledger of digital UPI collections, gate fee reconciliations, and penalty receipts</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-secondary" id="export-payments-csv-btn">
              <i data-lucide="download"></i>
              <span>Export Financial CSV</span>
            </button>
          </div>
        </div>

        <!-- Filter Controls -->
        <div class="card" style="padding: 1.25rem; margin-bottom: 1.5rem;">
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem;">
            <div class="tab-nav" id="admin-pay-tabs">
              <button type="button" class="tab-btn active" data-status="All">
                <span>All Transactions</span>
                <span class="tab-count" id="count-pay-all">0</span>
              </button>
              <button type="button" class="tab-btn" data-status="Paid">
                <span>Settled (Paid)</span>
                <span class="tab-count" id="count-pay-paid">0</span>
              </button>
              <button type="button" class="tab-btn" data-status="Pending">
                <span>Pending Clearance</span>
                <span class="tab-count" id="count-pay-pending">0</span>
              </button>
              <button type="button" class="tab-btn" data-status="Failed">
                <span>Failed</span>
                <span class="tab-count" id="count-pay-failed">0</span>
              </button>
            </div>

            <div class="input-with-icon" style="min-width: 280px;">
              <span class="input-icon"><i data-lucide="search"></i></span>
              <input type="text" id="admin-pay-search" class="form-input" placeholder="Search TXN ID, driver, or plate...">
            </div>
          </div>
        </div>

        <!-- Payments Master Table -->
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Transaction ID</th>
                <th>Payment Type</th>
                <th>Driver &amp; Plate</th>
                <th>Facility &amp; Bay</th>
                <th>Payment Mode</th>
                <th>Settlement Date</th>
                <th>Status</th>
                <th style="text-align: right;">Amount (INR)</th>
              </tr>
            </thead>
            <tbody id="admin-payments-tbody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
          <div class="pagination" id="admin-payments-pagination"></div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="../js/pages/admin-payments.js"></script>
</body>
</html>
